name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs write access to push the built site to gh-pages.
permissions:
  contents: write

# Serialize publications to the gh-pages branch (main site + PR previews).
# Queuing instead of cancelling: merge events fire push + closed simultaneously,
# and a cancelled run would silently skip its publication.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish main site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (docs depends on core types)
        run: pnpm build

      - name: Build docs site
        run: pnpm docs:build
        env:
          VITE_BASE: /bezier-curve-editor/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish

      - name: Publish main site (preserving PR previews)
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '/pr-preview' apps/docs/.vitepress/dist/ publish/
          touch publish/.nojekyll
          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          # --no-verify: generated site bundles must not run through the
          # husky/lint-staged hooks (they lint source, not dist output)
          git -C publish commit --no-verify -m "Deploy main site ${GITHUB_SHA}"
          git -C publish push
