name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs write access to push the built site to gh-pages.
permissions:
  contents: write

# Serialize publications to the gh-pages branch (main site + PR previews).
# Queuing instead of cancelling: merge events fire push + closed simultaneously,
# and a cancelled run would silently skip its publication.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish main site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (docs depends on core types)
        run: pnpm build

      - name: Build docs site
        run: pnpm docs:build
        env:
          VITE_BASE: /bezier-curve-editor/

      - name: Publish main site (preserving PR previews)
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          # Use a worktree of the SAME repository instead of a second
          # actions/checkout: a nested checkout once made `git -C publish`
          # resolve to the root repo, committing site files onto main and
          # pushing main->main. The worktree cannot be mistaken for another
          # repository, and the explicit HEAD:gh-pages refspec makes the
          # push destination deterministic.
          git fetch origin gh-pages
          rm -rf publish
          git worktree add --detach publish origin/gh-pages
          # --exclude '/.git': rsync --delete must not remove the worktree's
          # .git file — without it git falls back to the root repository and
          # the deploy commit lands on main instead of gh-pages
          rsync -a --delete --exclude '/.git' --exclude '/pr-preview' apps/docs/.vitepress/dist/ publish/
          touch publish/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          # --no-verify: generated site bundles must not run through the
          # husky/lint-staged hooks (they lint source, not dist output)
          git -C publish commit --no-verify -m "Deploy main site ${GITHUB_SHA}"
          test "$(git -C publish rev-parse HEAD^)" = "$(git rev-parse origin/gh-pages)"
          git push origin "HEAD:gh-pages" --force-with-lease=gh-pages
