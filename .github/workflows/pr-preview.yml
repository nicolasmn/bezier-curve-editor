name: PR Preview

# Deploys a live preview of every pull request to GitHub Pages under
# /bezier-curve-editor/pr-preview/pr-<number>/ so it can be verified in the
# browser before merging. The main site is never touched.
#
# NOTE: pull_request_target runs this workflow from the base branch with a
# write token while building the PR's merge commit. This is safe here because
# the repository is private with trusted collaborators only — do not enable it
# on a public fork-facing repo without extra hardening.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      action:
        description: What to do
        type: choice
        options:
          - deploy
          - remove
        default: deploy

permissions:
  contents: write
  pull-requests: write

# Serialize publications to gh-pages together with the main-site deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  preview:
    name: Publish PR preview
    runs-on: ubuntu-latest

    steps:
      - name: Resolve action
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.action }}" in
              opened|reopened|synchronize) echo "action=deploy" >> "$GITHUB_OUTPUT" ;;
              closed)                      echo "action=remove" >> "$GITHUB_OUTPUT" ;;
              *)                           echo "action=none"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # --- Build the PR (deploy only) -------------------------------------

      - name: Checkout PR merge commit
        if: steps.resolve.outputs.action == 'deploy'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge

      - name: Setup pnpm
        if: steps.resolve.outputs.action == 'deploy'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.resolve.outputs.action == 'deploy'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.resolve.outputs.action == 'deploy'
        run: pnpm install --frozen-lockfile

      - name: Build packages (docs depends on core types)
        if: steps.resolve.outputs.action == 'deploy'
        run: pnpm build

      - name: Build docs site
        if: steps.resolve.outputs.action == 'deploy'
        run: pnpm docs:build
        env:
          VITE_BASE: /bezier-curve-editor/pr-preview/pr-${{ env.PR_NUMBER }}/

      - name: Build demo
        if: steps.resolve.outputs.action == 'deploy'
        run: pnpm --filter @bezier-curve-editor/demo build
        env:
          VITE_BASE: /bezier-curve-editor/pr-preview/pr-${{ env.PR_NUMBER }}/

      - name: Copy demo into docs output
        if: steps.resolve.outputs.action == 'deploy'
        run: cp -r apps/demo/dist apps/docs/.vitepress/dist/demo

      # --- Publish ---------------------------------------------------------

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish

      - name: Deploy preview
        if: steps.resolve.outputs.action == 'deploy'
        working-directory: publish
        run: |
          mkdir -p "pr-preview/pr-${PR_NUMBER}"
          rsync -a --delete ../apps/docs/.vitepress/dist/ "pr-preview/pr-${PR_NUMBER}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview unchanged"
            exit 0
          fi
          git commit -m "Deploy preview pr-${PR_NUMBER} (${GITHUB_SHA})"
          git push

      - name: Remove preview
        if: steps.resolve.outputs.action == 'remove'
        working-directory: publish
        run: |
          rm -rf "pr-preview/pr-${PR_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to remove"
            exit 0
          fi
          git commit -m "Remove preview pr-${PR_NUMBER}"
          git push

      - name: Comment preview URL on PR
        if: steps.resolve.outputs.action == 'deploy'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = `<!-- bezier-pr-preview:${prNumber} -->`;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${prNumber}/`;
            const body = [
              marker,
              `🔍 **Preview deployment:** ${url}`,
              '',
              'Rebuilt automatically on every push to this PR. Removed when the PR is closed.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
